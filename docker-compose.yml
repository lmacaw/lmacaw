services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LMACAW_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://lmacaw:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/lmacaw
      MEDIA_STORAGE: ${MEDIA_STORAGE:-filesystem}
      MEDIA_ROOT: /data/media
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      AI_WORKER_TOKEN: ${AI_WORKER_TOKEN:-}
      BODY_SIZE_LIMIT: 23068672
    volumes:
      - media:/data/media
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: lmacaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: lmacaw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmacaw -d lmacaw"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres:/var/lib/postgresql/data
volumes:
  postgres:
  media:
